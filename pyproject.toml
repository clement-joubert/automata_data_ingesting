[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automata-data-ingesting"
version = "0.1.0"
description = "AUTOMATA data preparation and ingestion tools"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.5,<5"]

[project.scripts]
automata-upload = "automata_data_ingesting.uploading.sftp:main"
automata-photogrammetry = "automata_data_ingesting.photogrammetry.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
